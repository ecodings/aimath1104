<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>챗봇 수학 실험실</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#EEF4F6; --bg-grid:#E1EBEE;
  --surface:#fff; --surface-2:#F4F7F8;
  --ink:#1F4E5F; --text:#2C3E46; --sub:#5B7480; --muted:#8FA3AB;
  --teal:#1B8691; --teal-l:#D3EEF0; --teal-b:#9FCFD5; --teal-xl:#EAF6F7;
  --line:#DCE7EA; --line2:#B8D6DA;
  --coral:#E07A55; --coral-l:#FBEAE3; --coral-b:#F0BFAE; --blue:#2F78B0; --blue-l:#E4EEF7;
  --beige:#C9BDB2;
  --r-lg:20px;
  --shadow:0 14px 34px -16px rgba(20,60,72,.22), 0 2px 8px -3px rgba(20,60,72,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);background-image:linear-gradient(var(--bg-grid) 1px,transparent 1px),linear-gradient(90deg,var(--bg-grid) 1px,transparent 1px);background-size:28px 28px;
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
textarea,input{-webkit-user-select:text;user-select:text}
button,select,textarea,input{font-family:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;min-height:100dvh;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
/* ---------- home ---------- */
.hero{padding:calc(env(safe-area-inset-top) + 26px) 20px 6px}
.hero h1{font-size:24px;font-weight:800;color:var(--ink);line-height:1.35;display:flex;align-items:center;gap:8px}
.hero h1 .lg{width:32px;height:32px;border-radius:10px;background:var(--teal);color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(20,60,72,.4)}
.hero p{font-size:14px;color:var(--sub);line-height:1.6;margin-top:6px}
.hero .tag{display:inline-block;margin-top:10px;font-size:12px;font-weight:700;color:var(--ink);background:var(--teal-l);border-radius:99px;padding:4px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 0}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-height:178px;color:inherit}
.pcard:active{transform:scale(.98)}
.pcard .ic{width:42px;height:42px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800}
.pcard .st{font-size:10.5px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pcard .t{font-size:15px;font-weight:800;color:var(--ink);line-height:1.35}
.pcard .d{font-size:12px;color:var(--sub);line-height:1.45}
.pcard .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);font-weight:700}
.pcard .ft b{font-size:17px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:28px 0 10px;line-height:1.6}
.foot .e{font-size:34px;display:block;margin-bottom:4px}
/* ---------- topbar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;background:linear-gradient(180deg,var(--bg) 80%,rgba(238,244,246,0))}
.top .home{flex:none;height:34px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;color:var(--ink);font-size:13px;font-weight:800;display:flex;align-items:center;gap:5px}
.top .ttl{min-width:0}
.top .ttl b{display:block;font-size:15.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl span{font-size:11.5px;color:var(--muted);font-weight:700}
.top .nav{margin-left:auto;display:flex;gap:6px;flex:none}
.top .nav button{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;color:var(--sub);font-size:16px;font-weight:800}
.top .nav button:disabled{opacity:.3}
.page{padding:4px 14px 0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 15px;display:flex;flex-direction:column;gap:11px}
.eyebrow{display:inline-flex;width:fit-content;font-size:11.5px;font-weight:800;color:var(--ink);background:var(--teal-l);padding:4px 10px;border-radius:99px}
.eyebrow.c{color:#B5552F;background:var(--coral-l)}
.ct{font-size:16.5px;font-weight:800;color:var(--ink);line-height:1.4}
.cd{font-size:13px;color:var(--sub);line-height:1.6}
.cd b{color:var(--ink)}
.steps{display:flex;flex-direction:column;gap:6px}
.steps div{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--text)}
.steps i{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;font-size:11.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:-1px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{height:36px;border-radius:99px;border:1.5px solid var(--line2);background:#fff;color:var(--sub);font-size:13px;font-weight:700;padding:0 13px;white-space:nowrap}
.btn.on{background:var(--teal-l);border-color:var(--teal);color:var(--ink)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn:disabled{opacity:.45}
.btn.sq{border-radius:10px}
select.sel{width:100%;height:42px;border-radius:12px;border:1.5px solid var(--teal-b);background:#fff;color:var(--ink);font-size:14.5px;font-weight:700;padding:0 10px}
.seg{display:flex;background:var(--surface-2);border:1.5px solid var(--line2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;height:34px;border:none;border-radius:9px;background:transparent;color:var(--sub);font-size:13.5px;font-weight:800;white-space:nowrap;padding:0 6px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(31,78,95,.18)}
.seg span{align-self:center;font-size:12px;color:var(--muted);font-weight:700;padding:0 4px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
/* ---------- tf-idf ---------- */
textarea.doc{width:100%;height:84px;border:1.5px solid var(--line2);border-radius:12px;padding:9px 11px;font-size:15.5px;line-height:1.5;color:var(--text);resize:none;background:#fff}
textarea.doc:focus{outline:none;border-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{height:32px;padding:0 9px;border-radius:8px;border:1.5px solid var(--line2);background:#fff;font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:center}
.chip .pt{font-weight:500;font-size:12px;color:var(--muted)}
.chip.ed{border-color:var(--coral);border-style:dashed}
.chip.ex{color:var(--muted);text-decoration:line-through;background:var(--surface-2)}
.chip.sw{border-style:dotted}
.chip.hl{background:var(--teal-l);border-color:var(--teal)}
.pill{font-size:12px;font-weight:700;color:var(--teal);background:#fff;border:1.5px solid var(--teal-b);border-radius:99px;padding:2px 9px}
table.tf{width:100%;border-collapse:collapse;font-size:14px}
table.tf th{font-size:11.5px;font-weight:800;color:var(--sub);text-align:right;padding:6px 4px;border-bottom:1.5px solid var(--line)}
table.tf th:first-child,table.tf td:first-child{text-align:left}
table.tf th.hot{color:var(--teal)}
table.tf td{padding:0 4px;height:36px;border-bottom:1px solid var(--line);text-align:right;color:var(--sub)}
table.tf td.w{font-weight:800;color:var(--ink);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table.tf td.s{font-weight:800;color:var(--ink);width:92px}
table.tf td.s .b{display:inline-block;height:9px;border-radius:5px;background:var(--teal);vertical-align:1px;margin-right:6px}
table.tf td.s .b.top{background:var(--coral)}
table.tf tr.sel td{background:var(--teal-l)}
table.tf tr.zero td,table.tf tr.zero td.w,table.tf tr.zero td.s{color:var(--muted)} table.tf tr.zero .b{background:var(--muted)}
.dots i{display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);margin:0 3px 0 7px;vertical-align:-1px}
.dots i.on{background:var(--teal)}
.calc{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));z-index:10;background:#fff;border:1.5px solid var(--coral-b);border-radius:16px;padding:11px 14px;box-shadow:0 10px 30px -10px rgba(20,60,72,.35);font-size:13.5px;line-height:1.65}
.calc .h{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:700;flex-wrap:wrap}
.calc .h b{font-size:15px;color:var(--ink)}
.calc .hi{color:var(--coral);font-weight:800;font-size:18px}
.calc b{color:var(--ink)}
/* ---------- softmax ---------- */
.srow{display:grid;grid-template-columns:52px 1fr 74px;gap:9px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.srow .lb{font-size:16px;font-weight:800;color:var(--ink);line-height:1.1}
.srow .lb small{display:block;font-size:11px;color:var(--muted);font-weight:700}
.srow.top .lb{color:var(--coral)}
.ztrack{position:relative;height:40px;background:#fff;border:1.5px solid var(--line2);border-radius:10px;touch-action:none}
.ztrack .zero{position:absolute;top:6px;bottom:6px;width:1.5px;background:var(--muted)}
.ztrack .zb{position:absolute;top:14px;height:12px;border-radius:4px;background:var(--teal-b)}
.ztrack .kn{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--teal);border:3px solid #fff;box-shadow:0 1px 4px rgba(31,78,95,.35)}
.ztrack .zv{position:absolute;top:-1px;font-size:11px;font-weight:800;color:var(--ink)}
.pc{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.pc b{font-size:18px;color:var(--ink)}
.srow.top .pc b{color:var(--coral)}
.pc s{text-decoration:none;font-size:11px;color:var(--muted);font-weight:700}
.sum{display:flex;justify-content:space-between;font-size:13.5px;font-weight:800;color:var(--ink);background:var(--teal-xl);border-radius:10px;padding:8px 10px}
.form{background:var(--surface-2);border:1.5px solid var(--teal-b);border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.7;word-break:keep-all}
.form b{color:var(--ink)} .form .hi{color:var(--coral);font-weight:800;font-size:16px}
.trow{display:flex;align-items:center;gap:10px}
.trow label{font-size:13.5px;font-weight:800;color:var(--ink);flex:none}
.trow input{flex:1;accent-color:var(--teal)}
.trow .tv{font-size:16px;font-weight:800;color:var(--teal);width:34px;text-align:right}
.cmp .nm{font-size:14.5px;font-weight:800;color:var(--ink);margin-top:2px}
.cmp .nm span{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:4px}
.cbar{display:flex;align-items:center;gap:8px;height:22px;font-size:13px}
.cbar span{width:68px;flex:none;color:var(--sub);font-size:12px;font-weight:700}
.cbar i{display:block;height:12px;border-radius:5px}
.cbar b{color:var(--ink)}
.box{border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6}
.box.no{background:#fff;border:1.5px dashed var(--coral-b);color:#B5552F}
.box.sg{background:var(--surface-2);border:1.5px solid var(--teal-b)}
.box.sg b{color:var(--ink)}
.sn{border:1.5px solid var(--line2);border-radius:12px;padding:8px 10px}
.sn .h{display:flex;align-items:center;gap:8px;font-size:13.5px}
.sn .h b{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.sn .h em{margin-left:auto;font-style:normal;font-weight:800;color:var(--coral)}
.st2{display:flex;height:20px;border-radius:6px;overflow:hidden;margin-top:6px}
.st2 div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;white-space:nowrap;overflow:hidden}
.sn .rel{font-size:12px;color:var(--teal);font-weight:800;margin-top:4px}
#camwin{width:100%;aspect-ratio:1/1;max-height:340px;border-radius:16px;background:var(--surface-2);border:1.5px dashed var(--line2);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px;position:relative}
#camwin.live{border-style:solid;border-color:var(--teal);padding:0}
#camwin canvas{width:100%;height:100%;display:block}
#camwin .ph{font-size:13.5px;color:var(--sub);line-height:1.55}
#camwin .lp{position:absolute;left:10px;top:10px;background:var(--coral);color:#fff;font-size:11.5px;font-weight:800;border-radius:99px;padding:2px 9px}
.big{font-size:40px;font-weight:800;color:var(--coral);line-height:1.1}
/* ---------- attention ---------- */
.wchips{display:flex;flex-wrap:wrap;gap:8px 6px}
.wc{display:flex;flex-direction:column;align-items:center;gap:2px}
.wc b{height:38px;padding:0 11px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-size:16px;color:var(--ink);display:flex;align-items:center}
.wc.q b{background:var(--teal);border-color:var(--teal);color:#fff}
.wc span{font-size:11.5px;font-weight:800;color:var(--sub);height:15px}
.wc.add b{border-style:dashed;color:var(--teal)}
svg.plane{width:100%;aspect-ratio:1/1;display:block;touch-action:none;background:#fff;border:1.5px solid var(--line);border-radius:14px}
table.att{width:100%;border-collapse:collapse;font-size:13.5px}
table.att th{background:var(--ink);color:#fff;font-weight:700;height:34px;font-size:12px}
table.att th:first-child{border-radius:9px 0 0 0}table.att th:last-child{border-radius:0 9px 0 0}
table.att td{height:38px;border-bottom:1px solid var(--line);text-align:center}
table.att td.w{font-weight:800;color:var(--ink);text-align:left;padding-left:8px}
table.att tr.tot td{background:var(--surface-2);font-weight:800;color:var(--ink)}
.wbar{display:flex;align-items:center;gap:5px;justify-content:flex-start;padding-left:4px}
.wbar i{display:block;height:11px;border-radius:5px;background:var(--teal)}
.wbar i.top{background:var(--coral)}
.ctx{background:var(--coral-l);border:1.5px solid var(--coral-b);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65;word-break:keep-all}
.ctx span{font-weight:800;color:#B5552F}.ctx b{color:#B5552F}
.verdict{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;width:fit-content}
.verdict.fin{background:var(--blue-l);color:var(--blue)}.verdict.nat{background:var(--teal-l);color:var(--teal)}.verdict.mid{background:var(--surface-2);color:var(--sub);border:1px solid var(--line2)}
/* ---------- sheet ---------- */
#dim{position:fixed;inset:0;background:rgba(31,78,95,.25);display:none;z-index:40}
#dim.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s;z-index:41;box-shadow:0 -8px 30px rgba(31,78,95,.2);max-height:86dvh;overflow:auto}
#sheet.on{transform:none}
#sheet h4{margin:0 0 10px;font-size:16px;color:var(--ink);display:flex;align-items:center}
#sheet h4 button{margin-left:auto}
#sheet input{width:100%;height:44px;border:1.5px solid var(--line2);border-radius:10px;padding:0 12px;font-size:16px}
#sheet .bs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
#sheet .bs button{height:42px;border-radius:10px;border:1.5px solid var(--line2);background:#fff;font-size:14px;font-weight:700;color:var(--ink)}
#sheet .bs button.pri{background:var(--teal);border-color:var(--teal);color:#fff}
#sheet .pal{display:flex;flex-wrap:wrap;gap:6px}
#sheet .pal span{width:100%;font-size:12px;color:var(--sub);font-weight:800;margin-top:6px}
#sheet .pal button{height:36px;padding:0 11px;border-radius:9px;border:1.5px solid var(--line2);background:#fff;font-size:14.5px;font-weight:700;color:var(--ink)}
/* v6 */
.dbox{border:1.5px solid var(--line);border-radius:14px;padding:9px 11px;background:var(--surface-2)}
.dbox.me{border-color:var(--teal);background:#fff}
.dh{display:flex;align-items:center;gap:8px}
.dh b{font-size:14px;color:var(--ink)}
.dh .ed{margin-left:auto;height:28px;border-radius:8px;border:1.5px solid var(--line2);background:#fff;color:var(--teal);font-size:12px;font-weight:800;padding:0 9px}
.dt{font-size:14.5px;line-height:1.75;color:var(--text);margin-top:4px;word-break:keep-all}
.tw{border-radius:5px;padding:1px 1px}
.tw.wx{color:var(--muted);text-decoration:line-through}
.tw.wtop{color:#B5552F;font-weight:800}
.tw.wsel{background:var(--teal-l);box-shadow:0 0 0 1.5px var(--teal);font-weight:800;color:var(--ink)}
.tw.wsel2{background:var(--coral-l);box-shadow:0 0 0 1.5px var(--coral-b)}
.faces{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.face{border:1.5px solid var(--line2);border-radius:12px;background:#fff;padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.face.me{border-color:var(--teal);background:var(--teal-xl)}
.face span{font-size:11.5px;color:var(--sub);font-weight:800}
.face b{font-size:14.5px;color:#B5552F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.face b.s2{font-size:12.5px;color:var(--ink)}
.face em{font-style:normal;font-size:11px;color:var(--muted)}
.cols{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.cols:has(.col:nth-child(2):last-child){--n:2}
.col{display:flex;flex-direction:column;align-items:center;gap:4px}
.bars{display:flex;gap:6px;align-items:flex-end;height:118px;border-bottom:1.5px solid var(--line2);padding:0 4px}
.bw2{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;width:30px}
.bw2 em{font-style:normal;font-size:11.5px;font-weight:800;color:var(--sub)}
.bw2 i{display:block;width:26px;border-radius:5px 5px 0 0}
.col .cl{font-size:13px;font-weight:800;color:var(--ink)}
.col .cl span{font-size:11px;color:var(--muted)}
i.lg{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 3px 0 8px;vertical-align:-1px}
.camrow{display:flex;gap:10px}
.camrow #camwin{width:46%;flex:none;aspect-ratio:1/1;padding:8px;gap:8px}
.camrow #camwin .ph{font-size:12px}
.cres{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.cres .big{font-size:34px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pt2{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:4px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.pt2 span{font-size:11px;color:var(--muted);font-weight:700}
.pt2 em{font-style:normal}
.pair svg.plane{border-radius:12px}
.srow{padding:5px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="dim"></div><div id="sheet"></div>
<script>
// ===== 챗봇 수학 실험실 · 공통 로직 =====
const PRESET_DOCS = [

    if (!TM.model) TM.model = await tmImage.load(TM_MODEL_URL + 'model.json', TM_MODEL_URL + 'metadata.json');
    try{ const ls = TM.model.getClassLabels(); if (ls && ls.length){ CLS_LABELS.splice(0, CLS_LABELS.length, ...ls); } }catch(e){}
    onStatus('카메라를 준비하는 중…');
    TM.webcam = new tmImage.Webcam(224, 224, true);
    await TM.webcam.setup({ facingMode:'user' });
    await TM.webcam.play();
    TM.running = true; TM.loading = false; onStatus('');
    const loop = async t => {
      if (!TM.running) return;
      TM.webcam.update();
      if (t - TM.last > 120){
        TM.last = t;
        try{
          const pred = await TM.model.predict(TM.webcam.canvas);
          const p = CLS_LABELS.map((l,i) => { const f = pred.find(x => x.className === l) || pred[i]; return f ? f.probability : 0; });
          onPred(p);
        }catch(e){}
      }
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
    return TM.webcam.canvas;
  }catch(e){
    TM.loading = false; TM.running = false;
    onStatus('카메라를 쓸 수 없어요. 인터넷 연결과 카메라 권한을 확인해 주세요. 카메라 없이 점수 막대를 끌어 실험할 수 있습니다.');
    return null;
  }
}
function tmStop(){ TM.running = false; try{ TM.webcam && TM.webcam.stop(); }catch(e){} TM.webcam = null; }

    (rows.some(r=>r.common) ? `<div class="note" style="margin-top:6px">회색 = 모든 리뷰에 나온 단어 · ${B?'IDF = 1이라 TF-IDF = TF':'IDF = log 1 = 0'}</div>` : '');

/* ===================== softmax (shared) ===================== */
const zx = v => (Math.max(ZR.min, Math.min(ZR.max, v)) - ZR.min) / (ZR.max - ZR.min) * 100;
function rowsHTML(n){ return Array.from({length:n},(_,i)=>`<div class="srow" id="sr${i}"><div class="lb"></div><div class="ztrack" data-i="${i}"><div class="zero"></div><div class="zb"></div><div class="kn"></div><div class="zv num"></div></div><div class="pc"><b class="num"></b><s class="num"></s></div></div>`).join(''); }
function bindTracks(st, after){
  document.querySelectorAll('.ztrack').forEach(t => { let on = false;
    const set = e => { const r = t.getBoundingClientRect(); let v = ZR.min + (e.clientX - r.left) / r.width * (ZR.max - ZR.min);
      st.z[+t.dataset.i] = Math.max(ZR.min, Math.min(ZR.max, Math.round(v*10)/10)); after(); };
    t.addEventListener('pointerdown', e => { e.preventDefault(); on = true; t.setPointerCapture(e.pointerId); set(e); });
    t.addEventListener('pointermove', e => { if (on) set(e); });
    t.addEventListener('pointerup', () => on = false); t.addEventListener('pointercancel', () => on = false); });
}
function paintRows(z, names, sm, top, sub){
  const x0 = zx(0);
  z.forEach((v,i) => { const row = $('#sr'+i); if (!row) return; row.classList.toggle('top', i===top);
    row.querySelector('.lb').innerHTML = sub ? `${XYZ[i]}<small>${names[i]}</small>` : (names[i] || XYZ[i]);
    const x1 = zx(v); row.querySelector('.zero').style.left = x0+'%';
    const zb = row.querySelector('.zb'); zb.style.left = Math.min(x0,x1)+'%'; zb.style.width = Math.abs(x1-x0)+'%';
    row.querySelector('.kn').style.left = x1+'%';
    const zv = row.querySelector('.zv'); zv.textContent = fmt(v,1); zv.style.left = (v >= 0 ? Math.min(x1+5, 84) : Math.max(x1-16, 1))+'%';
    row.querySelector('b').textContent = fmt(sm.p[i],2); row.querySelector('s').textContent = 'eᶻ ' + fmt(sm.e[i],2); });
}
const formula = (z, T, L, sm, top) => { const Tt = T !== 1 ? `/${fmt(T,1)}` : '';
  return `‘${L}’ 확률 = e<sup>${fmt(z[top],2)}${Tt}</sup> ÷ (${z.map(v=>`e<sup>${fmt(v,2)}${Tt}</sup>`).join(' + ')})<br>= <b>${fmt(sm.e[top],2)}</b> ÷ <b>${fmt(sm.sum,2)}</b> = <span class="hi">${fmt(sm.p[top],2)}</span>`; };
const tup = z => '(' + z.map(v => String(+v.toFixed(2))).join(', ') + ')';
function relation(a, b, L){
  if (a.T !== b.T) return `${L}에서 온도만 ${fmt(a.T,1)} → ${fmt(b.T,1)}`;
  const d = b.z.map((v,i) => v - a.z[i]); if (d.every(x => Math.abs(x) < 1e-9)) return '';
  if (d.every(x => Math.abs(x - d[0]) < 1e-9)) return `${L}에 모두 ${d[0] > 0 ? '+' : ''}${+d[0].toFixed(2)} → 확률은 그대로`;
  const nz = a.z.findIndex(v => Math.abs(v) > 1e-9);
  if (nz >= 0){ const k = b.z[nz]/a.z[nz]; if (k > 0 && b.z.every((v,i) => Math.abs(v - k*a.z[i]) < 1e-9)) return `${L}의 ${+k.toFixed(2)}배 → ${k > 1 ? '1등이 더 강조됨' : '차이가 줄어 고르게'}`; }
  return '';
}
const clampZ = v => Math.max(ZR.min, Math.min(ZR.max, Math.round(v*100)/100));

function pageSM(){

  $('#pg').innerHTML = `<div class="card" style="gap:9px">

  // ② table
  $('#attt').innerHTML = `<table class="att num"><tr><th>단어</th><th>키 k</th><th>점수 s</th><th>eˢ</th><th>가중치</th></tr>
    ${st.items.map((it,i)=>`<tr><td class="w">${it.w}</td><td>[${fmt(it.k[0],1)}, ${fmt(it.k[1],1)}]</td><td>${fmt(a.s[i],2)}</td><td>${fmt(a.e[i],2)}</td><td><div class="wbar"><i class="${i===top?'top':''}" style="width:${Math.max(3,a.w[i]*36)}px"></i><b style="color:${i===top?'var(--coral)':'var(--ink)'}">${fmt(a.w[i],2)}</b></div></td></tr>`).join('')}
    <tr class="tot"><td class="w">합</td><td></td><td></td><td>${fmt(a.sumE,2)}</td><td>1.00</td></tr></table>
    <div class="ctx num" style="margin-top:10px"><span>문맥 벡터</span> = ${st.items.map((it,i)=>`${fmt(a.w[i],2)}×[${fmt(it.v[0],1)}, ${fmt(it.v[1],1)}]`).join(' + ')} = <b>[${fmt(a.c[0],2)}, ${fmt(a.c[1],2)}]</b></div>
    <div class="note" style="margin-top:8px">점수 <b>s = q · k${S.sqrt?' ÷ √2':''}${S.T!==1?' ÷ T':''}</b> → 가중치 <b>= eˢ ÷ Σeˢ</b> → 문맥 벡터 <b>= Σ 가중치 × v</b> · ${P.note}</div>`;
  $('#tv').textContent = S.T.toFixed(1); $('#t-sqrt').classList.toggle('on', S.sqrt);
}
render();
</script>
</body>
</html>
